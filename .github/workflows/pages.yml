name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check website scripts
        run: |
          node --check site/assets/js/app.js
          node --check site/assets/js/library-worker.js
          node --check site/assets/js/math-loader.js
          node --check site/assets/js/geometry.js
          node --check site/assets/js/design.js
          node --check site/assets/js/practice-core.js
          node --check site/assets/js/practice.js
          node scripts/check_practice.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
